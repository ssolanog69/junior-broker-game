<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Domina el Parqué</title>
<style>
body {
    background-color: black;
    color: #00ff00;
    font-family: 'Courier New', monospace;
    padding: 20px;
}
#terminal {
    border: 2px solid #00ff00;
    padding: 20px;
    height: 70vh;
    overflow-y: auto;
}
input {
    background: black;
    border: 1px solid #00ff00;
    color: #00ff00;
    padding: 10px;
    width: 300px;
}
button {
    background: #00ff00;
    color: black;
    padding: 10px;
    border: none;
    cursor: pointer;
}
</style>
</head>
<body>

<h2>STRATTON OAKMONT - SISTEMA INTERNO</h2>
<div id="terminal"></div>
<br>
<input type="number" id="respuesta" placeholder="Ingresa tu respuesta">
<button onclick="verificar()">ENVIAR</button>

<script>
const terminal = document.getElementById("terminal");

const errores = [
"¡MALDITA SEA, NOVATO! ¡MI ABUELA CALCULA MEJOR QUE TÚ!",
"¿ESTÁS INTENTANDO ROBARME? ¡ESE CÁLCULO ES BASURA!",
"WTF! ¡EL SRI ACABA DE ENTRAR POR TU CULPA!",
"¡EQUIVOCADO! ¡VUELVE A LA ESCUELA!",
"¡ESTÁS DESPEDIDO!... TE DOY OTRA OPORTUNIDAD"
];

let nivel = 1;

function escribir(texto) {
    terminal.innerHTML += texto + "<br><br>";
    terminal.scrollTop = terminal.scrollHeight;
}

function iniciarNivel() {
    if (nivel === 1) {
        escribir("INICIANDO TRANSMISIÓN...");
        escribir("NIVEL 1: THE COLD CALL");
        escribir("ESCUCHA BIEN, NOVATO...");
        escribir("TENEMOS AL SR. BELFORT SENIOR EN LA LÍNEA.");
        escribir("QUIERE SABER CUÁNTO GANARÁ SI INVIERTE $1,000,000 AL 1% MENSUAL DURANTE 8 MESES.");
        escribir("NO METAS LA PATA...");
    }
}

function verificar() {
    const respuesta = parseFloat(document.getElementById("respuesta").value);

    if (nivel === 1) {
        const correcta = 80000;

        if (respuesta === correcta) {
            escribir("✔ CORRECTO... BIEN HECHO, NOVATO.");
            escribir("ACABAS DE CERRAR TU PRIMER TRATO.");
            escribir("SIGUE ASÍ Y TAL VEZ NO TE DESPIDA HOY.");
            sonidoExito();
            nivel++;
        } else {
            const random = errores[Math.floor(Math.random() * errores.length)];
            escribir(random);
            sonidoError();
        }
    }
}

function sonidoExito() {
    const audio = new Audio("https://www.soundjay.com/misc/sounds/cash-register-01.mp3");
    audio.play();
}

function sonidoError() {
    const audio = new Audio("https://www.soundjay.com/button/beep-10.mp3");
    audio.play();
}

iniciarNivel();
</script>

</body>
</html>
