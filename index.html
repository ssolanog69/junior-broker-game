<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Stratton Oakmont - Nivel 1</title>
    <style>
        :root { --green: #00ff41; --gold: #ffd700; --bg: #0a0a0a; }
        body { background: var(--bg); color: var(--green); font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #terminal { width: 90%; max-width: 700px; border: 2px solid var(--green); padding: 30px; box-shadow: 0 0 20px rgba(0, 255, 65, 0.2); }
        .header { display: flex; justify-content: space-between; border-bottom: 1px solid var(--green); margin-bottom: 20px; padding-bottom: 10px; }
        input { background: transparent; border: none; border-bottom: 2px solid var(--green); color: var(--gold); font-size: 1.5rem; width: 100%; outline: none; margin: 20px 0; }
        button { background: var(--green); color: black; border: none; padding: 15px 30px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1.2rem; }
        button:hover { background: var(--gold); }
        #feedback { margin-top: 20px; font-size: 1.2rem; text-align: center; min-height: 50px; }
    </style>
</head>
<body>

<div id="terminal">
    <div class="header">
        <span>BROKER ID: #001</span>
        <span id="timer" style="color:var(--gold)">TIEMPO: 02:00</span>
    </div>

    <h2>> NIVEL 1: THE COLD CALL</h2>
    <p>Inversión: $1,000,000 | Tasa: 1% mensual simple | Tiempo: 8 meses</p>
    <p><strong>¿CUÁNTO RECIBIRÁ DE INTERÉS?</strong></p>

    <input type="number" id="answer" placeholder="Escribe el resultado aquí...">
    <button id="btnVenta">CERRAR VENTA</button>

    <div id="feedback"></div>
</div>

<script>
    let timeLeft = 120;
    const timerDisplay = document.getElementById('timer');
    const btn = document.getElementById('btnVenta');
    
    // Cronómetro
    const countdown = setInterval(() => {
        timeLeft--;
        let mins = Math.floor(timeLeft / 60);
        let secs = timeLeft % 60;
        timerDisplay.innerText = `TIEMPO: 0${mins}:${secs < 10 ? '0' : ''}${secs}`;
        if (timeLeft <= 0) { clearInterval(countdown); timerDisplay.style.color = "red"; }
    }, 1000);

    // Lógica del botón (ahora más segura)
    btn.onclick = function() {
        const val = document.getElementById('answer').value;
        const feedback = document.getElementById('feedback');
        
        if (val == "80000") {
            clearInterval(countdown);
            feedback.innerHTML = `<span style="color:var(--gold)">¡TRATO CERRADO! $80,000 en comisiones. Has ganado el "Teléfono de Bronce".</span><br><br><button onclick="alert('Próximamente: Nivel 2')">IR AL NIVEL 2</button>`;
        } else {
            feedback.innerHTML = `<span style="color:red">ERROR. LA SEC TE ESTÁ VIGILANDO. REVISA EL CÁLCULO.</span>`;
        }
    };
</script>

</body>
</html>
